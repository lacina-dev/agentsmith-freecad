<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- AgentSmith workbench icon: parametric cube being "forged", with an AI spark -->
  <g stroke="#1a3a5c" stroke-width="2" stroke-linejoin="round">
    <!-- top face -->
    <polygon points="32,8 54,20 32,32 10,20" fill="#7fb2e5"/>
    <!-- left face -->
    <polygon points="10,20 32,32 32,58 10,46" fill="#3d76ad"/>
    <!-- right face -->
    <polygon points="54,20 32,32 32,58 54,46" fill="#265a8f"/>
  </g>
  <!-- parametric dimension line across the top face -->
  <line x1="14" y1="22" x2="32" y2="12" stroke="#0d2540" stroke-width="1.6" stroke-dasharray="3,2"/>
  <!-- AI spark (four-point star), top-right -->
  <path d="M 50 2 L 52.8 9.2 L 60 12 L 52.8 14.8 L 50 22 L 47.2 14.8 L 40 12 L 47.2 9.2 Z"
        fill="#f6a623" stroke="#b26a00" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- small echo spark -->
  <path d="M 58 24 L 59.2 27 L 62 28 L 59.2 29 L 58 32 L 56.8 29 L 54 28 L 56.8 27 Z"
        fill="#f6a623"/>
</svg>
